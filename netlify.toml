# Netlify settings for the Tours 999 static site (the React app in Frontend/frontend-app).
# `npm run build` writes every page as its own HTML file (see scripts/prerender.mjs), so
# old links like /about/ and /5-day-sri-lanka-tour-package/ are served directly, and any
# other address gets 404.html with a proper 404 status.
[build]
  base = "Frontend/frontend-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The old WordPress home page also answered at /home/.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
